name: Deploy to AWS Lambda

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: aws-production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI }}
      LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      AWS_FUNCTION_URL: ${{ vars.AWS_FUNCTION_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            ECR_REPOSITORY_URI
            LAMBDA_FUNCTION_NAME
            AWS_FUNCTION_URL
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions configuration: ${name}" >&2
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: jobbr-github-actions

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ vars.AWS_ECR_REPOSITORY_URI }}:${{ github.sha }}
            ${{ vars.AWS_ECR_REPOSITORY_URI }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Lambda to the new image
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY_URI:${GITHUB_SHA}" \
            --no-cli-pager
          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Check the deployed application
        run: |
          curl --fail --silent --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "${AWS_FUNCTION_URL%/}/login" > /dev/null
